worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging estruturado ─────────────────────────────────────────────────
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":"$status",'
        '"bytes":"$body_bytes_sent",'
        '"duration":"$request_time",'
        '"request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 25M;   # permite upload de até 25MB (>= max-file-size do Spring)

    # ── Upstream: aplicação Spring Boot ─────────────────────────────────────
    upstream ragbot_app {
        server app:8080;
        keepalive 32;
    }

    # ── HTTP → redireciona para HTTPS ────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Permite verificação do Let's Encrypt (ACME challenge)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redireciona todo o resto para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;   # substitua pelo domínio real em produção

        # Certificados TLS (Let's Encrypt ou certificado próprio)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Configurações de segurança TLS recomendadas
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # ── Headers de segurança ─────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options           DENY;
        add_header X-Content-Type-Options    nosniff;
        add_header X-XSS-Protection          "1; mode=block";
        add_header Referrer-Policy           "strict-origin-when-cross-origin";

        # ── Proxy para a aplicação ───────────────────────────────────────────
        location / {
            proxy_pass         http://ragbot_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Propaga o Request ID para o backend
            proxy_set_header   X-Request-ID      $http_x_request_id;

            # Timeouts (deve ser maior que o timeout do Groq)
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Actuator: acesso restrito ao próprio servidor ────────────────────
        location /actuator/ {
            # Em produção, restrinja ao IP do servidor de monitoramento
            # allow 10.0.0.1;
            # deny all;
            proxy_pass http://ragbot_app;
            proxy_set_header Host $host;
        }
    }
}
