version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/amd64
    container_name: ragbot-postgres
    environment:
      POSTGRES_DB: ragbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${RAGBOT_DB_PORT:-5544}:5432"
    volumes:
      - ragbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ragbot_pgdata:
