server:
  port: ${PORT:8080}
  # Erros fora do GlobalExceptionHandler (ex.: filtros) também não vazam detalhes
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
  # Confia em X-Forwarded-For apenas vindo do proxy (nginx/Railway) — usado no rate limit por IP
  forward-headers-strategy: native

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  datasource:
    # ── Railway PostgreSQL interno ────────────────────────────────────────────
    # Railway injeta PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE automaticamente.
    # Para Supabase: defina SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
    # e SPRING_DATASOURCE_PASSWORD como variáveis de ambiente no Railway.
    #
    # Exemplo Supabase (Transaction Pooler — porta 6543):
    #   SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
    #   SPRING_DATASOURCE_USERNAME=postgres.<project-ref>
    #   SPRING_DATASOURCE_PASSWORD=<sua-senha>
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ragbot}?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}   # sem default: falha no startup se ausente
    hikari:
      maximum-pool-size: 2        # 2 conexões — economiza memória e slots no DB
      minimum-idle: 1
      idle-timeout: 60000         # libera conexão ociosa em 60s
      connection-timeout: 20000
      keepalive-time: 30000       # mantém conexão viva (importante em Supabase)

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB         # reduzido de 20MB para economizar RAM no parse
      max-request-size: 10MB

ragbot:
  storage:
    dir: /data/documents          # volume persistente criado no Dockerfile
  security:
    jwt:
      secret: ${JWT_SECRET}       # sem default: produção NUNCA usa o segredo de dev
    admin-password: ${RAGBOT_ADMIN_PASSWORD:}      # troca a senha do admin do seed (V3) no startup
    fail-on-default-admin-password: true           # não sobe com admin/Admin@123  async:
    core-pool-size: ${ASYNC_CORE_POOL:1}   # 1 thread sempre ativa (vs 2 no dev)
    max-pool-size: ${ASYNC_MAX_POOL:2}     # máx 2 simultâneas para não pressionar GC
    queue-capacity: ${ASYNC_QUEUE:10}      # fila menor para evitar acúmulo em memória

# ── Logging — apenas o essencial em produção ─────────────────────────────────
logging:
  level:
    root: WARN
    com.ragbot: INFO              # logs de negócio mantidos em INFO
    org.flywaydb: INFO            # log de migração do banco
    org.springframework.web: WARN
    org.springframework.security: WARN
    com.zaxxer.hikari: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

# ── Actuator — apenas health em produção ────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info      # metrics removido — economiza memória de coleta
      base-path: /actuator
  endpoint:
    health:
      show-details: never         # não expõe detalhes internos publicamente
      show-components: never
  health:
    diskspace:
      enabled: false              # Railway não tem disco fixo para monitorar
